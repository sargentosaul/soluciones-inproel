<title>Soluciones Inproel</title>
<style>
  :root { --bg: #f4f6f8; --card: #fff; --text: #1d2733; --muted: #5d6b7a; --border: #d9e0e7; --accent: #1f5f99; --rojo: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12171c; --card: #1b2229; --text: #e6ebf0; --muted: #9aa7b4; --border: #2e3943; --accent: #5a9bd8; --rojo: #ef5350; }
  }
  * { box-sizing: border-box; }
  body.candado { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .candado form { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 380px; }
  .candado h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .candado p { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; }
  .candado input[type=password] { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
                         background: var(--card); color: var(--text); }
  .candado label.recordar { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; font-size: 0.9rem; color: var(--muted); }
  .candado button { font: inherit; font-weight: 600; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  .candado button:disabled { opacity: 0.6; cursor: wait; }
  .candado .error { color: var(--rojo); font-weight: 600; margin: 12px 0 0; font-size: 0.95rem; }
  [hidden] { display: none !important; }
</style>
</head>

const LLAVE = "soluciones-llave";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const a64 = (u) => btoa(String.fromCharCode(...u));

function guardada() {
  try { return sessionStorage.getItem(LLAVE) || localStorage.getItem(LLAVE); } catch (e) { return null; }
}
function olvidar() {
  try { sessionStorage.removeItem(LLAVE); localStorage.removeItem(LLAVE); } catch (e) { /* nada */ }
}
async function derivar(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64(DATOS.sal), iterations: DATOS.iter, hash: "SHA-256" }, base, 256);
  return new Uint8Array(bits);
}
async function descifrar(llave) {
  const k = await crypto.subtle.importKey("raw", llave, "AES-GCM", false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATOS.iv) }, k, b64(DATOS.ct));
  return new TextDecoder().decode(claro);
}
// Se espera a que la página termine de cargar: si document.open() se llama mientras el navegador todavía
// la está leyendo (pasa con la clave recordada y un antivirus que inyecta scripts), no reemplaza el candado
// sino que mezcla las dos páginas y quedan dos campos "clave". Los id del candado llevan "cnd-" por lo mismo.
async function mostrar(html) {
  if (document.readyState !== "complete") await new Promise((r) => window.addEventListener("load", r, { once: true }));
  document.querySelectorAll("style").forEach((s) => s.remove());
  document.open(); document.write(html); document.close();
}

(async () => {
  const g = guardada();
  if (g) {
    try { await mostrar(await descifrar(b64(g))); return; } catch (e) { olvidar(); }
  }
  const form = document.getElementById("cnd-form");
  form.hidden = false;
  document.getElementById("cnd-clave").focus();
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const boton = document.getElementById("cnd-entrar");
    boton.disabled = true;
    document.getElementById("cnd-error").hidden = true;
    try {
      const llave = await derivar(document.getElementById("cnd-clave").value);
      const html = await descifrar(llave);
      try {
        (document.getElementById("cnd-recordar").checked ? localStorage : sessionStorage).setItem(LLAVE, a64(llave));
      } catch (e) { /* sin almacenamiento: habra que escribir la clave en cada pagina */ }
      await mostrar(html);
    } catch (e) {
      document.getElementById("cnd-error").hidden = false;
      boton.disabled = false;
    }
  });
})();
</script>
